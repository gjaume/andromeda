# Blueprint de Render: web + worker + Postgres gestionado.
# Los secretos marcados con sync: false se rellenan a mano en el panel de Render.
databases:
  - name: andronautic-internal-db
    plan: basic-256mb
    region: frankfurt
    databaseName: andronautic_internal
    user: andronautic_internal
    postgresMajorVersion: "16"

envVarGroups:
  - name: andronautic-internal-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: interno.andronautic.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://interno.andronautic.com
      - key: GOOGLE_WORKSPACE_DOMAINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: POPEYE_API_BASE_URL
        sync: false
      - key: POPEYE_API_TOKEN
        sync: false
      - key: GMAIL_MAILBOX
        value: admin@andronautic.com
      - key: GMAIL_SERVICE_ACCOUNT_JSON
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

services:
  - type: web
    name: andronautic-internal-web
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - fromGroup: andronautic-internal-shared
      - key: DATABASE_URL
        fromDatabase:
          name: andronautic-internal-db
          property: connectionString

  - type: worker
    name: andronautic-internal-worker
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerCommand: python manage.py qcluster
    envVars:
      - fromGroup: andronautic-internal-shared
      - key: DATABASE_URL
        fromDatabase:
          name: andronautic-internal-db
          property: connectionString
