[project]
name = "andronautic-internal"
version = "0.1.0"
description = "Backoffice de utilidades internas para los departamentos de AndroNautic"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.11",
    "django-allauth[socialaccount]>=65.3",
    "django-unfold>=0.40",
    "django-q2>=1.7",
    "django-storages[s3]>=1.14",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "httpx>=0.27",
    "sentry-sdk[django]>=2.14",
    "google-auth[requests]>=2.35",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
