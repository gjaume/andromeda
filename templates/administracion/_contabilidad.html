{% if factura.duplicada_de %}<span class="muted small">No se sube (duplicada)</span>{% else %}<span class="checks">{% if factura.drive_url %}<a class="check is-done" href="{{ factura.drive_url }}" target="_blank" rel="noopener" title="Subida a Drive el {{ factura.subida_a_drive_en|date:'d/m/Y H:i' }}">✓ Drive</a>{% else %}<span class="check" title="Todavía no está en Drive">Drive</span>{% endif %}{% if factura.contabilizada_en %}<span class="check is-done" title="Vista en CONTABILIZADO el {{ factura.contabilizada_en|date:'d/m/Y H:i' }}">✓ Contabilizada</span>{% else %}<span class="check" title="Contabilidad aún no la ha movido a CONTABILIZADO">Contabilizada</span>{% endif %}</span>{% endif %}
