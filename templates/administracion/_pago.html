{% if factura.metodo_pago %}<span class="check is-done is-{{ factura.metodo_pago }}" title="Pagada el {{ factura.pagada_el|date:'d/m/Y' }}{% if factura.pago %}: {{ factura.pago.concepto }}{% endif %}{% if factura.pago_manual %} (marcado a mano){% endif %}">✓ {{ factura.get_metodo_pago_display }}</span>{% elif factura.duplicada_de or factura.tipo == "recibo" or factura.tipo == "anexo" or not factura.empresa.concilia_pagos %}<span class="muted small">—</span>{% elif factura.total is None %}<span class="check" title="No se ha podido leer el importe del PDF">Sin importe</span>{% else %}<span class="check is-pending" title="No se ha encontrado el pago en el extracto del banco ni en el de la tarjeta">Sin pagar</span>{% endif %}
